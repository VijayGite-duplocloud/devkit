# Dev-kit nginx config for the UI image. The published image serves the SPA only (no API proxy),
# and the app calls the API same-origin (apiUrl "/"). Here we proxy the API path prefixes to the
# studio container so the browser stays same-origin — no CORS needed. Mounted over
# /etc/nginx/conf.d/default.conf by docker-compose.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Extension bundles (POST …/admin/extensions/load-bundle) can be large. The studio accepts up to
    # 1GB; without this nginx caps the proxied body at its 1MB default and returns 413 before it reaches
    # the studio. Match the studio's limit.
    client_max_body_size 1g;

    # AI Studio micro-frontend assets.
    location /duplo-ai-studio/ {
        try_files $uri $uri/ /duplo-ai-studio/index.html;
    }

    # Dev-kit: never cache the SPA shell or any runtime-loaded remote entry, so a re-deployed
    # extension UI (and a rebuilt studio remote) shows on a hard refresh instead of a stale bundle.
    # Extension FE assets proxied to the studio already carry no-store (set by the backend).
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri /index.html;
    }
    # Proxy all backend API prefixes to the studio (auth, admin, access, and the aiservicedesk APIs).
    # MUST precede the remoteEntry no-cache block below: nginx matches regex locations in order, and that
    # block would otherwise swallow proxied extension FE bundles (/v1/.../fe/remoteEntry.json) and 404 them.
    location ~ ^/(v1|v3|api|admin|access|auth|healthz|swagger|signin-google)(/|$) {
        # Resolve the studio per request rather than once at nginx startup. A literal hostname in
        # proxy_pass is resolved a single time when the config loads and the IP is cached for the life
        # of the container, so recreating the studio (any compose change to it OR to mongo, which it
        # depends_on) strands this container proxying to a dead address — every API call 502s and the
        # login page renders with no auth methods, since it is those 502s that decide what to show.
        # Docker's embedded DNS at 127.0.0.11 plus a variable in proxy_pass forces a fresh lookup.
        # $request_uri is required: a variable proxy_pass no longer forwards the URI implicitly.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $studio http://duplo-ai-studio:60021;
        proxy_pass $studio$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        # The OIDC sign-in 302 carries chunked auth-session Set-Cookie headers (tokens stored in the
        # cookie) that overflow nginx's default 4k header buffer and 502 the login callback.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    # No-cache the SPA's own runtime-loaded remote entries (served statically here, NOT the proxied /v1 ones above).
    location ~* /remoteEntry\.js(on)?$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

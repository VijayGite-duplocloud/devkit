# Publishes each extension in this repo as a GitHub Release on push to main.
#
# For every extensions/<name>/ it builds the bundle and publishes one release per build, tagged
# <name>-v<version>-sdk-<sdkVersion> at the commit that was built. scripts/release-extensions.sh holds the rules:
# a build already released is skipped, and an extension whose content changed at a version that already has a
# release fails the job, so bumping manifest.version is how you publish a new version to the extension library.
#
# This file ships with the dev-kit. After scripts/init-project.sh makes the repo yours, set these repo secrets
# (same as Extension CI): DUPLO_HOST + DUPLO_TOKEN. The build fetches the host SDK feed from DUPLO_HOST, so it
# must be reachable from CI (a public DuploCloud, not localhost). Turn on immutable releases in the repository's
# settings, too; the publish step warns on every release that lands mutable.
#
# NOTE: the hot-load/deploy step is intentionally COMMENTED OUT (see below). We publish releases but do not
# auto-install onto the portal, so the install-from-registry flow stays testable end to end. Uncomment the
# "Deploy" step to auto-hot-load on merge.
name: Extension Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # required to create GitHub Releases

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DUPLO_TARGET: remote
      DUPLO_HOST: ${{ secrets.DUPLO_HOST }}
      DUPLO_TOKEN: ${{ secrets.DUPLO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Every tag and the history it points at: the publish step compares each released version's commit with
          # this one to tell an unchanged extension from one that changed without a version bump.
          fetch-depth: 0

      - name: Discover extensions
        id: guard
        run: |
          shopt -s nullglob
          dirs=(extensions/*/manifest.json extension/*/manifest.json extension/manifest.json)
          if [ ${#dirs[@]} -gt 0 ]; then echo "build=true" >> "$GITHUB_OUTPUT"
          else echo "build=false" >> "$GITHUB_OUTPUT"; echo "::notice::No extensions/*/manifest.json — nothing to release."; fi

      # Runs in the builder container (scripts/_builder.sh) on the runner's Docker, with the digest-pinned toolchain.
      - name: Build all extensions
        if: steps.guard.outputs.build == 'true'
        run: ./scripts/build-all.sh

      # Deploy (hot-load) is intentionally disabled so the install-from-registry flow can be tested end to end.
      # Uncomment to auto-install the built bundles onto the platform on merge to main.
      # - name: Deploy all extensions (hot-load to DuploCloud)
      #   if: steps.guard.outputs.build == 'true'
      #   run: ./scripts/deploy-all.sh

      - name: Publish GitHub releases (one per new build)
        if: steps.guard.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-extensions.sh
